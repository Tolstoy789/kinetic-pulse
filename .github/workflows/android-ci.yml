name: Android CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Lint · Tests · APK debug
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle (con caché)
        uses: gradle/actions/setup-gradle@v4

      - name: Validar Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Guard — ningún modelo en el repo
        run: |
          if git ls-files | grep -Ei '\.(bin|task|litertlm|tflite|gguf|safetensors)$'; then
            echo "::error::Se detectaron binarios de modelo versionados. Elimínalos del commit."
            exit 1
          fi

      - name: Lint
        run: ./gradlew lintDebug --stacktrace

      - name: Tests unitarios
        run: ./gradlew :core:test testDebugUnitTest --stacktrace

      - name: Build APK debug
        run: ./gradlew assembleDebug --stacktrace

      - name: Subir esquema de Room
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: room-schemas
          path: app/schemas/
          if-no-files-found: ignore

      - name: Guard — esquema de Room versionado
        run: |
          if [ -n "$(git status --porcelain -- app/schemas)" ]; then
            git status --porcelain -- app/schemas
            # Volcado para poder copiarlo desde el log si no se puede descargar el artefacto.
            git ls-files --others --modified -- app/schemas | while read -r f; do
              echo "::group::$f"; cat "$f"; echo; echo "::endgroup::"
            done
            echo "::error::El esquema de Room cambió o no está commiteado. Añade app/schemas/ (artefacto room-schemas) y, si sube la versión, escribe la migración."
            exit 1
          fi

      - name: Subir reportes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: |
            **/build/reports/
            **/build/test-results/
          retention-days: 7

      - name: Subir APK debug
        uses: actions/upload-artifact@v4
        with:
          name: kinetic-pulse-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 14
